name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alz
          POSTGRES_PASSWORD: alz_password
          POSTGRES_DB: alzheimers
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alz -d alzheimers"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://alz:alz_password@localhost:5432/alzheimers
      JWT_SECRET_KEY: ci-secret
      LLM_PROVIDER: fake
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: alembic upgrade head   # migration 0001 enables the pgvector extension
      - run: pytest -q --cov=app

  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # only the non-ML deps — the InsightFace tests are mocked
      - run: pip install fastapi "uvicorn[standard]" python-multipart pydantic pydantic-settings numpy pillow pytest httpx ruff
      - run: ruff check app tests
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
