[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alzheimers-companion-vision"
version = "0.1.0"
description = "Face detection + embedding service (InsightFace) for Alzheimer's Companion"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "numpy==1.26.4",
    "pillow==11.0.0",
    "onnxruntime==1.20.1",
    "insightface==0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
