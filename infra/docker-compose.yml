# Local development infrastructure.
#
#   docker compose up -d              # start db
#   docker compose --profile vision up -d --build   # also build + start the vision service
#   docker compose down              # stop (keeps data)
#   docker compose down -v           # stop + delete data
#
# The backend (Core API) still runs on the host during development
# (cd backend && uvicorn app.main:app --reload).

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: alz_db
    environment:
      POSTGRES_USER: alz
      POSTGRES_PASSWORD: alz_password
      POSTGRES_DB: alzheimers
    ports:
      - "5432:5432"
    volumes:
      - alz_db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alz -d alzheimers"]
      interval: 5s
      timeout: 5s
      retries: 10

  vision:
    build: ../vision-service
    container_name: alz_vision
    profiles: ["vision"]        # only starts when you pass --profile vision
    environment:
      VISION_SERVICE_TOKEN: dev-vision-token
      APP_ENV: development
    ports:
      - "8001:8001"
    volumes:
      - alz_vision_models:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  alz_db_data:
  alz_vision_models:
