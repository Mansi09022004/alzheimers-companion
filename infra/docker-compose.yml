# Local development / demo stack.
#
#   docker compose up -d                              # db only
#   docker compose --profile full up -d --build       # db + backend + dashboard
#   docker compose --profile full --profile vision up -d --build   # + vision service
#
# During active backend development it's usually nicer to run uvicorn on the host
# (hot reload) and only use `up -d` for the database.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: alz_db
    environment:
      POSTGRES_USER: alz
      POSTGRES_PASSWORD: alz_password
      POSTGRES_DB: alzheimers
    ports:
      - "5432:5432"
    volumes:
      - alz_db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alz -d alzheimers"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: alz_backend
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://alz:alz_password@db:5432/alzheimers
      JWT_SECRET_KEY: dev-compose-secret-change-me
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VISION_SERVICE_URL: http://vision:8001
      VISION_SERVICE_TOKEN: dev-vision-token
      ENABLE_SCHEDULER: "true"
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ../dashboard
      args:
        VITE_API_URL: http://localhost:8000
    container_name: alz_dashboard
    profiles: ["full"]
    ports:
      - "5173:80"

  vision:
    build: ../vision-service
    container_name: alz_vision
    profiles: ["vision"]
    environment:
      VISION_SERVICE_TOKEN: dev-vision-token
      APP_ENV: development
    ports:
      - "8001:8001"
    volumes:
      - alz_vision_models:/models

volumes:
  alz_db_data:
  alz_vision_models:
