# Local development infrastructure.
# Phase 0: database only. backend + vision-service containers are added in Phase 1.
#
#   docker compose up -d      # start
#   docker compose down       # stop (keeps data)
#   docker compose down -v    # stop + delete data

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: alz_db
    environment:
      POSTGRES_USER: alz
      POSTGRES_PASSWORD: alz_password
      POSTGRES_DB: alzheimers
    ports:
      - "5432:5432"
    volumes:
      - alz_db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alz -d alzheimers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alz_db_data:
